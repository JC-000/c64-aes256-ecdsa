# =============================================================================
# linker.cfg - ld65 linker configuration for the c64-aes256-ecdsa ca65 port
#
# Reproduces the memory layout the ACME build has used historically:
#   - BASIC-stub load at $0801 (SYS-into-code trick, see src/boot.asm)
#   - A fixed, page-aligned 1KB "quarter-square" table zone at $7800-$7BFF,
#     reserved/unused by the linker (the real table is built at RUNTIME by
#     fp_init_sqtab; this config just guarantees no other segment can ever
#     be placed on top of it)
#   - A general low-memory area ($0801-$77FF) for the bulk of
#     LIB_AES256ECDSA_CODE/RODATA/DATA
#   - A high-memory overflow area ($7C00-$CFFF) for any module too large to
#     fit before the quarter-square zone, mirroring the ACME source's
#     historical "* = $7C00" placement for newer/larger modules
#   - A zeropage layout that reserves the project's existing fixed zero-page
#     map and exposes the remaining genuinely-free C64 zero-page bytes as
#     three explicitly-named segments so future ca65 code can allocate zero
#     page without colliding with the project's existing hand-assigned
#     addresses. See src/zp_config.s for the authoritative, single-source-
#     of-truth zero-page map (used vs. free byte ranges, and which slots
#     back the ZP2/ZP3/ZP4 pools below).
# =============================================================================

FEATURES {
    STARTADDRESS: default = $0801;
}

MEMORY {
    # --- Zero page: three genuinely-free chunks, holes left where the
    #     project's fixed zero-page map already lives (see occupancy map
    #     above; $02-$09 is NOT free, so there is no ZP1 here) ---
    ZP2: file = "", define = yes, start = $0013, size = $000F; # $13-$21 (15 bytes)
    ZP3: file = "", define = yes, start = $002C, size = $000D; # $2C-$38 (13 bytes)
    # ZP4 was $3D-$8F (83 bytes) until the c64-polyval submodule landed.
    # The archive claims $40-$4F (polyval_acc), $50-$5F (pv_mul_input) and
    # $60 (pv_mul_nibble) as hand-assigned equates baked into every archive
    # member by tools/integration/build_polyval.sh -- addresses ld65 knows
    # nothing about, so it would happily place a .segment "ZEROPAGE"
    # allocation on top of them. ZP4 is therefore narrowed to the part above
    # that claim. ($3D-$3F, the 3 bytes below it, are free but too small to
    # be worth a fourth pool; src/zp_config.s carries the full occupancy map.)
    ZP4: file = "", define = yes, start = $0061, size = $002F; # $61-$8F (47 bytes)

    # --- Header: 2-byte PRG load-address, always $0801 ---
    LOADADDR: file = %O, start = %S - 2, size = $0002;

    # --- Low memory: BASIC stub + bulk of code/data, up to (not incl.) $7800 ---
    # fill=yes is REQUIRED here: a .prg is a flat, address-contiguous byte
    # stream with no ability to "jump" the load cursor forward, so if
    # anything is ever placed in QSTAB or HIMEM below, the file itself must
    # physically contain filler bytes for every address in between or those
    # later segments will land at the wrong file offset (i.e. the wrong
    # in-memory address once loaded). This mirrors what ACME's own "* = X"
    # forward jump does under the hood when producing a single cbm/plain
    # output file.
    MAIN:  file = %O, define = yes, start = %S, size = $7800 - %S, fill = yes;

    # --- Quarter-square multiply table zone: reserved, page-aligned, 1KB.
    #     In the real port nothing is ever loaded here from disk - the table
    #     is built at runtime by fp_init_sqtab. We still model it as a real
    #     MEMORY area (rather than just a gap) so a segment CAN be aligned
    #     and placed here, which is what proves the alignment constraint in
    #     the pilot's synthetic test program. fill=yes for the same reason
    #     as MAIN, in case HIMEM is ever used but QSTAB's segment is not. ---
    QSTAB: file = %O, define = yes, start = $7800, size = $0400, fill = yes;

    # --- High memory overflow area for modules too large to fit in MAIN,
    #     mirroring the ACME source's "* = $7C00" placement technique.
    #     Upper bound $CFFF keeps clear of the $D000 I/O area. ---
    HIMEM: file = %O, define = yes, start = $7C00, size = $D000 - $7C00;
}

SEGMENTS {
    ZEROPAGE: load = ZP4, type = zp, optional = yes, define = yes; # default .zeropage target (largest free chunk)
    ZP2:      load = ZP2, type = zp, optional = yes, define = yes;
    ZP3:      load = ZP3, type = zp, optional = yes, define = yes;

    LOADADDR: load = LOADADDR, type = ro;

    LIB_AES256ECDSA_STARTUP:  load = MAIN, type = ro, optional = yes;
    LIB_AES256ECDSA_CODE:     load = MAIN, type = ro, optional = yes;
    LIB_AES256ECDSA_RODATA:   load = MAIN, type = ro, optional = yes;
    LIB_AES256ECDSA_DATA:     load = MAIN, type = rw, optional = yes;
    LIB_AES256ECDSA_BSS:      load = MAIN, type = bss, optional = yes, define = yes;

    QSTAB:    load = QSTAB, type = rw, optional = yes, align = $100;

    LIB_AES256ECDSA_HICODE:   load = HIMEM, type = ro, optional = yes;
    LIB_AES256ECDSA_HIRODATA: load = HIMEM, type = ro, optional = yes;
    LIB_AES256ECDSA_HIDATA:   load = HIMEM, type = rw, optional = yes;

    # --- c64-polyval sibling archive (libs/polyval @ v0.7.1) ---------------
    # v0.7.1 is the first usable tag: v0.7.0 lacks the LIB_POLYVAL_NO_AES
    # gate. See the Makefile's c64-polyval block for why.
    #
    # Attributes copied from the library's own libs/polyval/src/lib_only.cfg
    # (its SPEC §4 reference placement); only the memory area differs.
    #
    # HIMEM, not MAIN: LIB_POLYVAL_SHORT_CODE is 13,614 bytes. The SHORT
    # profile is a fully unrolled 4-bit Shoup multiply ("Tier 1 unrolling"),
    # ~27x the size of the src/polyval.s loop it replaces ($1FC = 508 bytes),
    # and MAIN was already full to within 7 bytes ($0801-$77F8 of a $77FF
    # ceiling). Deleting src/polyval.s and data.s's 304 bytes of POLYVAL
    # buffers frees 812 bytes there -- two orders of magnitude short. HIMEM
    # ($7C00-$CFFF) has room and is where the project already parks modules
    # too big for MAIN.
    LIB_POLYVAL_SHORT_CODE:   load = HIMEM, type = ro, optional = yes;

    LIB_POLYVAL_BSS:          load = HIMEM, type = bss, optional = yes, define = yes;

    # REQUIRED: align = $100 (c64-lib-contract SPEC §4, and the library's own
    # lib_only.cfg comment). This is a PERFORMANCE invariant, not correctness
    # -- every htable access is a linker-resolved abs,x with no high-byte
    # address math, so an unaligned table still hashes correctly -- but the
    # hot-loop reads then cross a page for some indices (+1 cycle each) and
    # the library's documented ~18.8k-cycle SHORT multiply no longer holds.
    #
    # Dropping this attribute is COMPLETELY SILENT. The alignment request
    # exists ONLY here: libs/polyval/src/data.s reserves polyval_htable with a
    # bare `.res 256` and no source-level `.align`, so ld65 has nothing to
    # check the segment against and emits no diagnostic whatsoever. ld65's
    # §4 misalignment warning only ever fires against a source-side .align.
    # Verify after any cfg edit that build/aes256keygen.map shows
    # LIB_POLYVAL_HTABLE starting on a $xx00 boundary.
    LIB_POLYVAL_HTABLE:       load = HIMEM, type = bss, align = $100, optional = yes, define = yes;
}
